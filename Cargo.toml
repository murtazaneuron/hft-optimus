[package]
name = "hft-core"
version = "0.1.3"
edition = "2024"
rust-version = "1.97.1"
authors = ["Murtaza Ali Imtiaz <murtaza.neuron@gmail.com>"]
description = "LLM-driven high-frequency trading platform on Solana - PEV loop, Smart Order Routing, SignerContext keypair isolation, and AVM benchmarking via Rig (ARC)"
repository = "https://github.com/murtazaneuron/hft-core"
homepage = "https://www.murtazai.com"
documentation = "https://docs.rs/hft-core"
license = "MIT OR Apache-2.0"
keywords = ["agent", "defi", "hft", "rig", "solana"]
categories = ["asynchronous", "finance"]
readme = "README.md"

# ── Publish control ───────────────────────────────────────────────
# Only ship what library consumers need; keep IDE config, internal
# docs, and toolchain files out of the published crate.
exclude = [
  ".clippy.toml",
  ".env",
  ".env.example",
  ".github/",
  ".gitignore",
  ".zed/",
  "BUG-FIXES.md",
  "Cargo.lock",
  "FILE_STRUCTURE.md",
  "LICENSE-MAI",
  "docs/",
]

# ── Docs.rs ───────────────────────────────────────────────────────
# Build all features, inject the docsrs cfg flag so conditional items
# are visible, and silence the doctest runner (all examples use no_run).
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# ── Library target ────────────────────────────────────────────────
[lib]
name = "hft_core"
path = "src/lib.rs"

# ── Binary target ─────────────────────────────────────────────────
[[bin]]
name = "hft-core"
path = "src/main.rs"

# ── Core AI / Agent Framework ─────────────────────────────────────
[dependencies]
rig-core = "^0.37.0"

# ── Async Runtime ─────────────────────────────────────────────────
tokio = { version = "^1", features = ["full"] }

# ── Solana SDK ────────────────────────────────────────────────────
solana-client = "^3"
solana-program = "^3"
solana-sdk = "^3"
spl-token = "^9"

# ── Cryptography ──────────────────────────────────────────────────
ed25519-dalek = { version = "^2", features = ["rand_core"] }
k256 = { version = "^0.13", features = ["ecdsa", "sha256"] }
rand = "^0.10.1"
sha2 = "^0.11.0"

# ── Serialization ─────────────────────────────────────────────────
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"

# ── HTTP / TLS ────────────────────────────────────────────────────
# rustls is also pulled in via the default feature chain in reqwest 0.13;
# listing it explicitly documents the intent and avoids an OpenSSL dependency.
reqwest = { version = "^0.13", features = ["json", "rustls"] }

# ── CLI ───────────────────────────────────────────────────────────
clap = { version = "^4", features = ["derive"] }

# ── Logging ───────────────────────────────────────────────────────
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }

# ── Error Handling ────────────────────────────────────────────────
anyhow = "^1"
thiserror = "^2"

# ── Environment Config ────────────────────────────────────────────
dotenvy = "^0.15"

# ── Dev / Test ────────────────────────────────────────────────────
[dev-dependencies]
mockall = "^0.14.0"
tokio-test = "^0.4"

[lints.clippy]
all = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
# Suppress common false-positive pedantic lints.
module_name_repetitions = "allow"
must_use_candidate = "allow"
pedantic = { level = "warn", priority = -1 }

# ── Workspace-wide lints (mirrors rig upstream lint table) ────────
[lints.rust]
missing_docs = "warn"
unused = "warn"

# ── Release Profile ───────────────────────────────────────────────
# Maximise performance and minimise binary size through LTO and
# single-codegen-unit compilation.  Mirrors the rig workspace profile.
[profile.release]
opt-level = 3
strip = "debuginfo"
lto = true
panic = "abort"
codegen-units = 1

# ── Coverage ──────────────────────────────────────────────────────
# cargo-llvm-cov is the standard Rust coverage tool; it wraps
# LLVM source-based coverage instrumentation and emits lcov /
# HTML / Codecov-JSON reports without a separate nightly toolchain.
# Install once per CI runner:  cargo install cargo-llvm-cov --locked
# Run:  cargo llvm-cov --workspace --lcov --output-path lcov.info
[profile.coverage]
inherits = "test"
opt-level = 0
# LLVM source-based coverage requires debug info and disables LTO.
debug = true
lto = false
codegen-units = 256  # maximise parallelism during instrumented build
